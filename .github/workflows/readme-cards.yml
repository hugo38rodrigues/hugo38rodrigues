name: Update README cards
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Top languages
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=hugo38rodrigues&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=hugo38rodrigues&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: hugo38rodrigues
          output_path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=hugo38rodrigues&theme=tokyonight&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push